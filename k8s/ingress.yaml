apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-backend-service
                port:
                  number: 8080

          - path: /swagger-ui.html
            pathType: Prefix
            backend:
              service:
                name: event-backend-service
                port:
                  number: 8080

          - path: /swagger-ui/
            pathType: Prefix
            backend:
              service:
                name: event-backend-service
                port:
                  number: 8080

          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: event-backend-service
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-frontend-service
                port:
                  number: 80
